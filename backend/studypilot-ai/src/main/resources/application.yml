spring:
  application:
    name: studypilot

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/studypilot}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:studypilot-development-secret-key-2026-secure}
  expiration: 86400000